name: Build Max Share APKs (ARMv7 & ARMv8)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      new_features:
        description: 'New Features (optional, auto-detected from commits if blank)'
        required: false
        type: string
      fixes:
        description: 'Fixes (optional, auto-detected from commits if blank)'
        required: false
        type: string
      improvements:
        description: 'Improvements (optional, auto-detected from commits if blank)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Compressed ARMv7 & ARMv8 APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Accept Licenses
        run: |
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$ANDROID_SDK/cmdline-tools"

          SDKMANAGER=""
          if [ -x "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            FOUND_SM=$(find "$ANDROID_SDK/cmdline-tools" -name "sdkmanager" -type f 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_SM" ] && [ -x "$FOUND_SM" ]; then
              SDKMANAGER="$FOUND_SM"
            fi
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "Downloading Android command-line tools..."
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            mkdir -p /tmp/cmdline-extract
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
            rm -rf "$ANDROID_SDK/cmdline-tools/latest"
            mv /tmp/cmdline-extract/cmdline-tools "$ANDROID_SDK/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-extract
            SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Determine Release Version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="v1.0.${{ github.run_number }}"
          fi
          APP_VERSION_NAME="${RELEASE_TAG#v}"
          APP_VERSION_CODE=$((10 + ${{ github.run_number }}))
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$APP_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$APP_VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_OUT="${{ github.workspace }}/my-upload-key.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_OUT"
            echo "KEYSTORE_PATH=$KEYSTORE_OUT" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
          elif [ -f "${{ github.workspace }}/debug.keystore.base64" ]; then
            echo "Using repository debug.keystore.base64 for consistent signing across app updates."
            base64 -d "${{ github.workspace }}/debug.keystore.base64" > "$KEYSTORE_OUT"
            keytool -changealias -noprompt \
              -keystore "$KEYSTORE_OUT" \
              -alias androiddebugkey \
              -destalias upload \
              -storepass android
            echo "KEYSTORE_PATH=$KEYSTORE_OUT" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          else
            DEFAULT_PASS="maxshare_release_key"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_OUT" \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$DEFAULT_PASS" -keypass "$DEFAULT_PASS" \
              -dname "CN=Vilson Sonkar, O=Max Share, C=IN"
            echo "KEYSTORE_PATH=$KEYSTORE_OUT" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$DEFAULT_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$DEFAULT_PASS" >> "$GITHUB_ENV"
          fi

      - name: Build Separate ARMv7 & ARMv8 Release APKs
        run: |
          gradle :app:assembleRelease -PsplitApk \
            -PappVersionCode="${{ steps.version.outputs.version_code }}" \
            -PappVersionName="${{ steps.version.outputs.version_name }}" \
            --no-daemon

      - name: Prepare APK Artifacts, Sizes & Release Notes
        id: apks
        env:
          INPUT_NEW_FEATURES: ${{ inputs.new_features }}
          INPUT_FIXES: ${{ inputs.fixes }}
          INPUT_IMPROVEMENTS: ${{ inputs.improvements }}
        run: |
          mkdir -p "${{ github.workspace }}/release-apks"
          ARMV7_SRC=$(find app/build/outputs/apk/release -name "*armeabi-v7a*.apk" | head -n 1)
          ARMV8_SRC=$(find app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -n 1)

          if [ -z "$ARMV7_SRC" ] || [ -z "$ARMV8_SRC" ]; then
            echo "Failed to locate split APKs in app/build/outputs/apk/release"
            ls -la app/build/outputs/apk/release
            exit 1
          fi

          ARMV7_OUT="${{ github.workspace }}/release-apks/MaxShare-armv7-armeabi-v7a.apk"
          ARMV8_OUT="${{ github.workspace }}/release-apks/MaxShare-armv8-arm64-v8a.apk"
          cp "$ARMV7_SRC" "$ARMV7_OUT"
          cp "$ARMV8_SRC" "$ARMV8_OUT"

          ARMV7_SIZE=$(du -h "$ARMV7_OUT" | cut -f1)
          ARMV8_SIZE=$(du -h "$ARMV8_OUT" | cut -f1)
          echo "armv7_size=$ARMV7_SIZE" >> "$GITHUB_OUTPUT"
          echo "armv8_size=$ARMV8_SIZE" >> "$GITHUB_OUTPUT"

          RELEASE_TAG="${{ steps.version.outputs.release_tag }}"
          APP_VERSION_NAME="${{ steps.version.outputs.version_name }}"
          APP_VERSION_CODE="${{ steps.version.outputs.version_code }}"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            COMMIT_RANGE="${PREV_TAG}..HEAD"
          else
            COMMIT_RANGE="-n 15"
          fi

          NEW_FEATURES_LIST=""
          FIXES_LIST=""
          IMPROVEMENTS_LIST=""

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            lower=$(printf '%s' "$msg" | tr '[:upper:]' '[:lower:]')
            case "$lower" in
              feat*|add*|new*|support*|implement*)
                NEW_FEATURES_LIST="${NEW_FEATURES_LIST}- ${msg}"$'\n'
                ;;
              fix*|bug*|hotfix*|patch*|resolve*|crash*)
                FIXES_LIST="${FIXES_LIST}- ${msg}"$'\n'
                ;;
              *)
                IMPROVEMENTS_LIST="${IMPROVEMENTS_LIST}- ${msg}"$'\n'
                ;;
            esac
          done < <(git log $COMMIT_RANGE --no-merges --pretty=format:"%s" 2>/dev/null || true)

          if [ -n "$INPUT_NEW_FEATURES" ]; then
            NEW_FEATURES_LIST="- ${INPUT_NEW_FEATURES}"$'\n'
          elif [ -z "$NEW_FEATURES_LIST" ]; then
            NEW_FEATURES_LIST="- No new features added in this release."$'\n'
          fi

          if [ -n "$INPUT_FIXES" ]; then
            FIXES_LIST="- ${INPUT_FIXES}"$'\n'
          elif [ -z "$FIXES_LIST" ]; then
            FIXES_LIST="- No bug fixes recorded in this release."$'\n'
          fi

          if [ -n "$INPUT_IMPROVEMENTS" ]; then
            IMPROVEMENTS_LIST="- ${INPUT_IMPROVEMENTS}"$'\n'
          elif [ -z "$IMPROVEMENTS_LIST" ]; then
            IMPROVEMENTS_LIST="- General stability, performance, and build improvements."$'\n'
          fi

          NOTES_FILE="${{ github.workspace }}/release-apks/release-notes.md"
          {
            echo "## Max Share (${RELEASE_TAG})"
            echo ""
            echo "### App Details"
            echo "- **App Name:** Max Share"
            echo "- **Package ID:** \`com.big.share\`"
            echo "- **Version:** ${APP_VERSION_NAME} (Build ${APP_VERSION_CODE})"
            echo "- **Developer:** Vilson Sonkar"
            echo "- **Supported Android:** Android 9.0 (API 28) – Android 16 (API 36)"
            echo "- **Connectivity:** Offline Wi-Fi Direct P2P & Bluetooth discovery (no internet required)"
            echo "- **Core Capabilities:**"
            echo "  - Built-in picker for Images, Videos, Music, Installed Apps, APKs, and System Files"
            echo "  - Direct sharing from Android's system Share menu"
            echo "  - Live transfer progress, speed, and remaining time tracking with per-file cancellation"
            echo "  - Custom local profile (display name & avatar) and saving received files to Downloads"
            echo ""
            echo "| Architecture | APK File | Size |"
            echo "|---|---|---|"
            echo "| ARMv7 (\`armeabi-v7a\`) | \`MaxShare-armv7-armeabi-v7a.apk\` | ${ARMV7_SIZE} |"
            echo "| ARMv8 (\`arm64-v8a\`) | \`MaxShare-armv8-arm64-v8a.apk\` | ${ARMV8_SIZE} |"
            echo ""
            echo "### New Features"
            printf '%s' "$NEW_FEATURES_LIST"
            echo ""
            echo "### Fixes"
            printf '%s' "$FIXES_LIST"
            echo ""
            echo "### Improvements"
            printf '%s' "$IMPROVEMENTS_LIST"
          } > "$NOTES_FILE"

      - name: Upload ARMv7 APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MaxShare-armv7-apk
          path: release-apks/MaxShare-armv7-armeabi-v7a.apk

      - name: Upload ARMv8 APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MaxShare-armv8-apk
          path: release-apks/MaxShare-armv8-arm64-v8a.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.apks.outputs.release_tag }}"
          ARMV7_FILE="release-apks/MaxShare-armv7-armeabi-v7a.apk"
          ARMV8_FILE="release-apks/MaxShare-armv8-arm64-v8a.apk"
          NOTES_FILE="release-apks/release-notes.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARMV7_FILE" "$ARMV8_FILE" --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "$ARMV7_FILE" "$ARMV8_FILE" \
              --title "Max Share $TAG" \
              --latest \
              --notes-file "$NOTES_FILE"
          fi

      - name: Write Release Summary to Job Summary
        run: |
          cat release-apks/release-notes.md >> "$GITHUB_STEP_SUMMARY"
